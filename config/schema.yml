tables:
  steam_requirements_data:
    columns:
      steam_appid: bigint
      pc_minimum: varchar
      pc_recommended: varchar
      mac_minimum: varchar
      mac_recommended: varchar
      linux_minimum: varchar
      linux_recommended: varchar
  steam:
    columns:
      appid: bigint
      name: varchar
      release_date: date
      english: boolean
      developer: varchar
      publisher: varchar
      platforms: varchar
      required_age: int
      categories: varchar
      genres: varchar
      steamspy_tags: varchar
      achievements: int
      positive_ratings: int
      negative_ratings: int
      average_playtime: int
      median_playtime: int
      owners: varchar
      price: double
  steam_description_data:
    columns:
      steam_appid: bigint
      detailed_description: varchar
      about_the_game: varchar
      short_description: varchar
  steam_media_data:
    columns:
      steam_appid: bigint
      header_image: varchar
      screenshots: varchar
      background: varchar
      movies: varchar
  steam_support_info:
    columns:
      steam_appid: bigint
      website: varchar
      support_url: varchar
      support_email: varchar
  steamspy_tag_data:
    columns:
      appid: bigint
      tags: map(varchar, bigint)
path:
  source: s3a://{bucket_name}/silver/